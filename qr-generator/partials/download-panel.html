<div class="space-y-3" aria-label="Download options">
  <h2 class="text-sm font-semibold text-ink-900">Download</h2>
  <div class="grid grid-cols-3 gap-2">
    <button type="button" id="download-png" class="btn-download">PNG</button>
    <button type="button" id="download-svg" class="btn-secondary">SVG</button>
    <button type="button" id="download-jpg" class="btn-secondary">JPG</button>
  </div>
  <div class="flex flex-wrap gap-2 pt-1">
    <button type="button" id="save-design" class="btn-secondary text-xs">Save locally</button>
    <button type="button" id="export-project" class="btn-ghost text-xs">Export JSON</button>
    <label class="btn-ghost text-xs cursor-pointer">
      Import
      <input id="import-project" type="file" accept="application/json,.json,.everqr.json" class="sr-only" />
    </label>
  </div>
  <p class="text-xs text-ink-500">Created on your device. Forever yours — no account needed.</p>
</div>
