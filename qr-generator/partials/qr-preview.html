<aside class="sticky-preview animate-preview-in" aria-label="QR preview and downloads">
  <div class="panel-strong overflow-hidden">
    <div class="border-b border-ink-100 bg-gradient-to-br from-ink-950 via-ink-900 to-brand-900 px-5 py-4 text-white">
      <div class="flex items-center justify-between gap-3">
        <div>
          <p class="text-[11px] font-semibold uppercase tracking-[0.16em] text-brand-200">Live preview</p>
          <p class="mt-1 text-sm text-white/70">Updates as you type</p>
        </div>
        <span class="rounded-full bg-white/10 px-3 py-1 text-[11px] font-semibold text-brand-100">No watermark</span>
      </div>
    </div>
    <div class="space-y-5 p-5 sm:p-6">
      <div class="qr-preview-frame" id="qr-preview-canvas" role="img" aria-label="QR code preview"></div>
      <div class="space-y-2 text-center">
        <p id="qr-status" class="text-sm text-ink-500">Enter content to generate a live QR preview.</p>
        <p id="qr-warning" class="text-xs text-amber-700" hidden></p>
      </div>
      <!-- include:download-panel.html -->
      <p id="qr-privacy-note" class="text-center text-xs leading-relaxed text-ink-500"></p>
    </div>
  </div>
</aside>
